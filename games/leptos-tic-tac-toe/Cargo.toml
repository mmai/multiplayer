[package]
name = "leptos-tic-tac-toe"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos       = { version = "0.7", features = ["csr"] }
backbone-lib = { path = "../../backbone-lib" }
serde        = { version = "1.0", features = ["derive"] }
futures      = "0.3"
gloo-storage = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
